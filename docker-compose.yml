# hirecut local dev services.
#
# The Next app stays on the host (`cd web && PORT=3100 npm run dev`) so HMR is
# fast and Playwright's Chromium can use the host browser. Only stateful
# backing services live in Docker.
services:
  db:
    image: postgres:17-alpine
    container_name: hirecut-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirecut
      POSTGRES_PASSWORD: hirecut_dev
      POSTGRES_DB: hirecut
      # Deterministic collation so ORDER BY on titles matches across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5433:5432"   # 5433 on the host: avoids collision with any native pg
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, only when db-data is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirecut -d hirecut"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
